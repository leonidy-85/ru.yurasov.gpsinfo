name: build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtpositioning5-dev qtdeclarative5-dev

      - name: Build and run unit tests
        run: |
          mkdir -p build-tests
          cd build-tests
          qmake ../tests/tst_gpsdatasource.pro
          make -j"$(nproc)"
          ./tst_gpsdatasource
